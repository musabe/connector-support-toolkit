# Scenario: mysql-no-replication
# Incident type: CDC connector auth fails — missing replication privilege
#
# Symptom: Connector starts but cannot read binlog events
# Root cause: User lacks REPLICATION SLAVE privilege
# Fix: GRANT REPLICATION SLAVE ON *.* TO 'user'@'%'; FLUSH PRIVILEGES;
#
# Expected results:
#   PASS  TCP reachability
#   PASS  Authenticated connect
#   PASS  SSL
#   FAIL  Replication privilege       ← key failure
#   PASS  Database read access
#   PASS  log_bin
#   PASS  binlog_format
#   PASS  binlog_row_image
#   PASS  gtid_mode
#
# Run:
#   docker compose -f docker/docker-compose-scenarios.yml up -d
#   python -m src.connector_check --config scenarios/mysql-no-replication.yml

host:     ${MYSQL_HOST:-localhost}
port:     ${MYSQL_NOREPL_PORT:-3308}
db:       test
user:     norepl
password: norepl
db_type:  mysql
timeout:  10
skip:     []
