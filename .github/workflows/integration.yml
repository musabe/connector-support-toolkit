name: Integration tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: demo
          POSTGRES_DB: test
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U demo -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Configure wal_level=logical
        env:
          PGPASSWORD: demo
        run: |
          psql -h localhost -p 5435 -U demo -d test \
            -c "ALTER SYSTEM SET wal_level = logical;"
          # Reload config — wal_level needs a restart in real Postgres
          # For CI we verify it via the check output rather than restarting
          echo "wal_level configured"

      - name: Run connector check against PostgreSQL
        run: |
          python -m src.connector_check \
            --host localhost --port 5435 \
            --db test --user demo --password demo \
            --db-type postgres \
            --output-file reports/ci-postgres.json
        continue-on-error: true

      - name: Show report
        run: cat reports/ci-postgres.json

      - name: Assert connectivity and permissions passed
        run: |
          python - <<'EOF'
          import json, sys
          report = json.load(open("reports/ci-postgres.json"))
          checks = {c["name"]: c["status"] for c in report["checks"]}

          failures = []
          required_pass = ["TCP reachability", "Authenticated connect", "Driver version"]
          for name in required_pass:
              if checks.get(name) not in ("PASS", "WARN"):
                  failures.append(f"{name}: {checks.get(name, 'MISSING')}")

          if failures:
              print("FAILED checks:", failures)
              sys.exit(1)
          print("All required checks passed or warned as expected.")
          print("Summary:", report["summary"])
          EOF

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-postgres-report
          path: reports/ci-postgres.json
          retention-days: 14

  mysql-integration:
    name: MySQL integration
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: demo
          MYSQL_PASSWORD: demo
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u demo -pdemo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Grant replication privilege
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot \
            -e "GRANT REPLICATION SLAVE, REPLICATION CLIENT ON *.* TO 'demo'@'%'; FLUSH PRIVILEGES;"

      - name: Enable binlog ROW format
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot \
            -e "SET GLOBAL binlog_format = 'ROW'; SET GLOBAL binlog_row_image = 'FULL';"

      - name: Run connector check against MySQL
        run: |
          python -m src.connector_check \
            --host 127.0.0.1 --port 3306 \
            --db test --user demo --password demo \
            --db-type mysql \
            --output-file reports/ci-mysql.json
        continue-on-error: true

      - name: Show report
        run: cat reports/ci-mysql.json

      - name: Assert connectivity and permissions passed
        run: |
          python - <<'EOF'
          import json, sys
          report = json.load(open("reports/ci-mysql.json"))
          checks = {c["name"]: c["status"] for c in report["checks"]}

          failures = []
          required_pass = ["TCP reachability", "Authenticated connect", "Driver version"]
          for name in required_pass:
              if checks.get(name) not in ("PASS", "WARN"):
                  failures.append(f"{name}: {checks.get(name, 'MISSING')}")

          if failures:
              print("FAILED checks:", failures)
              sys.exit(1)
          print("All required checks passed or warned as expected.")
          print("Summary:", report["summary"])
          EOF

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-mysql-report
          path: reports/ci-mysql.json
          retention-days: 14
